[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tfg_segmentation"
version = "0.1.0"
description = "Modelos fundacionales para segmentación de imagen — TFG"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
